<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TALA Trajet — Mon compte</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <!-- Logo à gauche -->
  <div class="brand">TALA Trajet</div>

  <!-- Navigation au centre -->
  <nav class="main-nav" id="navMenu">
    <a href="index.html">Accueil</a>
    <a href="results.html">Résultats</a>
    <a href="booking.html">Réservation</a>
    <a href="confirmation.html">Confirmation</a>
    <a href="account.html" class="active">Mon compte</a>
    <a href="about.html">À propos</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Bouton menu à droite -->
  <button class="menu-btn" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
</header>

<!-- MAIN -->
<main>
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">Mon compte</h1>
      <p class="hero-sub">Gérez vos informations et consultez vos réservations</p>
    </div>
  </section>

  <section class="container">
    <!-- Infos personnelles -->
    <div class="card">
      <h2>Informations personnelles</h2>
      <div id="accountInfo"></div>
    </div>

    <!-- Historique des réservations -->
    <div class="card">
      <h2>Historique des réservations</h2>
      <div id="reservationHistory"></div>
    </div>
  </section>
</main>

<!-- FOOTER -->
<footer>
  <div class="container">
    <p>© 2026 TALA Trajet — Tous droits réservés</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const accountInfo = document.getElementById("accountInfo");
  const reservationHistory = document.getElementById("reservationHistory");

  // Exemple de récupération depuis localStorage
  const userInfo = JSON.parse(localStorage.getItem("userInfo"));
  const reservations = JSON.parse(localStorage.getItem("reservations")) || [];

  // Affichage infos personnelles
  if (userInfo) {
    accountInfo.innerHTML = `
      <p><strong>Nom :</strong> ${userInfo.name || "Non renseigné"}</p>
      <p><strong>Email :</strong> ${userInfo.email || "Non renseigné"}</p>
      <p><strong>Téléphone :</strong> ${userInfo.phone || "Non renseigné"}</p>
    `;
  } else {
    accountInfo.innerHTML = `
      <p style="color:#e74c3c;">⚠ Aucune information trouvée.</p>
      <button onclick="window.location.href='index.html'" class="btn-login" style="margin-top:10px;">
        Retour à l'accueil
      </button>
    `;
  }

  // Affichage historique des réservations
  if (reservations.length > 0) {
    reservationHistory.innerHTML = "<ul>" + reservations.map(r => `
      <li class="history-item ${r.status}">
        <strong>${r.date}</strong> — Réservation #${r.id} (${r.status})
      </li>
    `).join("") + "</ul>";
  } else {
    reservationHistory.innerHTML = "<p>Aucune réservation trouvée.</p>";
  }
});

// Script menu mobile
document.addEventListener("DOMContentLoaded", () => {
  const menuBtn = document.getElementById("menuToggle");
  const navMenu = document.getElementById("navMenu");

  menuBtn.addEventListener("click", () => {
    navMenu.classList.toggle("open");
  });
});
</script>

</body>
</html>
