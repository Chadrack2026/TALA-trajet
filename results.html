<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TALA Trajet — Résultats</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="brand">TALA Trajet</div>
    
    <nav class="main-nav" id="navMenu">
    <a href="index.html"> Accueil</a>
    <a href="results.html" class="active">Résultats</a>
    </nav>


      <!-- Bouton menu à droite -->
  <button class="menu-btn" id="menuToggle" aria-label="Ouvrir le menu">☰</button>
  </header>

  <!-- MAIN -->
  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">Résultats de votre recherche</h1>
        <p class="hero-sub">Voici les trajets disponibles selon vos critères.</p>
      </div>
    </section>

    <section class="container">
      <div id="resultsList" class="cards"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>© 2026 TALA Trajet — Tous droits réservés</p>
    </div>
  </footer>

  <!-- SCRIPT -->
  <script>
    /*********************************************************
 * 1. Connexion Supabase
 *********************************************************/
const { createClient } = window.supabase;

const supabaseUrl = "https://fsxtngwitqpcfobijxqk.supabase.co";
const supabaseKey = "sb_publishable_J5FXAkT-ZPyiAEQP6oB8CA_wgDuYSm-";

const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

/*********************************************************
 * 2. Paramètres URL
 *********************************************************/
const params = new URLSearchParams(window.location.search);

const from = params.get("from");
const to = params.get("to");
const date = params.get("date");
const passengers = parseInt(params.get("passengers")) || 1;

/*********************************************************
 * 3. Charger les trajets disponibles
 *********************************************************/
async function loadResults() {
  const container = document.getElementById("resultsList");

  container.innerHTML = "<div class='loading'>Chargement des trajets...</div>";

  /*******************************************************
   * Requête Supabase avec jointures
   *******************************************************/
  let query = supabaseClient
    .from("schedules")
    .select(`
      id,
      departure_time,
      arrival_time,
      price,
      available_seats,
      bus:bus_id (
        bus_number,
        total_seats,
        bus_type,
        agency:agency_id ( name )
      ),
      route:route_id (
        departure_city,
        arrival_city
      )
    `)
    .eq('status', 'active'); // on ne prend que les trajets actifs

  // Filtre sur ville départ et arrivée
  if (from) query = query.ilike("route.departure_city", `%${from}%`);
  if (to) query = query.ilike("route.arrival_city", `%${to}%`);

  const { data, error } = await query;

  container.innerHTML = "";

  if (error) {
    container.innerHTML = `<p>Erreur Supabase : ${error.message}</p>`;
    return;
  }

  /*******************************************************
   * Filtrage local supplémentaire (date + places)
   *******************************************************/
  const filtered = data.filter(schedule => {
    // Vérification de la date si renseignée
    const matchDate = date
      ? new Date(schedule.departure_time).toISOString().startsWith(date)
      : true;

    // Vérification du nombre de places disponibles
    const seatsAvailable = (schedule.available_seats || 0) >= passengers;

    return matchDate && seatsAvailable;
  });

  /*******************************************************
   * Aucun résultat trouvé
   *******************************************************/
  if (filtered.length === 0) {
    container.innerHTML = "<p>Aucun trajet trouvé.</p>";
    return;
  }

  /*******************************************************
   * Tri des trajets par prix croissant
   *******************************************************/
  filtered.sort((a, b) => a.price - b.price);

  /*******************************************************
   * Affichage des résultats
   *******************************************************/
  container.innerHTML = `<p><strong>${filtered.length}</strong> trajet(s) trouvé(s)</p>`;

  filtered.forEach(schedule => {
    const departureDate = new Date(schedule.departure_time).toLocaleString();
    const arrivalDate = new Date(schedule.arrival_time).toLocaleString();

    container.innerHTML += `
      <div class="card">
        <div class="card-body">
          <h4>${schedule.route.departure_city} → ${schedule.route.arrival_city}</h4>

          <p>Agence : <strong>${schedule.bus.agency?.name || "N/A"}</strong></p>

          <p>Départ : ${departureDate} • Arrivée : ${arrivalDate}</p>

          <p>Prix : <strong>${schedule.price} FC</strong></p>

          <p>Places disponibles : <strong>${schedule.available_seats}</strong></p>

          <button class="btn" onclick="selectTrip('${schedule.id}')">
            Réserver
          </button>
        </div>
      </div>
    `;
  });
}

/*********************************************************
 * 4. Sélection trajet → booking.html
 *********************************************************/
function selectTrip(id) {
  window.location.href = `booking.html?trajet_id=${id}&passengers=${passengers}`;
}

/*********************************************************
 * 5. Menu mobile toggle
 *********************************************************/
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");

menuToggle.addEventListener("click", () => {
  navMenu.classList.toggle("open");
});

/*********************************************************
 * 6. Lancer la fonction au chargement de la page
 *********************************************************/
loadResults();
  </script>

</body>
</html>
